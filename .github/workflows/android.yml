name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: android
        env:
          APP_URL: ${{ vars.APP_URL }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.{0}', github.run_number) }}
        run: gradle assembleRelease --no-daemon

      # Forks without the KEYSTORE_* secrets get a throwaway key, so their APK can't upgrade over this one.
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.p12
          else
            export KEYSTORE_PASSWORD=throwaway
            keytool -genkeypair -keystore release.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Remote Agent"
          fi
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.p12 --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD --out AgentRemote.apk aligned.apk
          "$BT/apksigner" verify --print-certs AgentRemote.apk
          rm release.p12

      - uses: actions/upload-artifact@v4
        with:
          name: AgentRemote-apk
          path: AgentRemote.apk

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" AgentRemote.apk --title "Remote Agent $GITHUB_REF_NAME" \
            --notes "安卓 App：下载 AgentRemote.apk 安装，首次打开填入你的手机 App 地址。"
