<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; object-src 'none'"><title>Remote Agent · 设备配对</title><link rel="stylesheet" href="approval.css?v=209"></head>
<body><main>
<header><h1>设备配对</h1><select id="language" aria-label="界面语言"><option value="zh">中文</option><option value="en">English</option></select><span id="countdown" aria-label="剩余配对时间">03:00</span></header>
<section class="pair"><canvas id="qr" aria-label="手机配对二维码"></canvas><div><p>用同一台设备的各个入口扫码，或输入下面的配对码。</p><label for="pairingCode">手动配对码</label><input id="pairingCode" readonly><button id="copy">复制配对码</button></div></section>
<section class="group"><div><strong id="groupName">设备 1</strong><p>同一台设备的入口会自动归组。要配对另一台设备，请点击右侧按钮。</p></div><button id="next">开始配对另一台设备</button></section>
<p id="status" role="status">正在读取申请…</p><div id="requests"></div>
<footer><button id="refresh">刷新列表</button><button id="close">结束配对</button></footer>
<p class="hint">配对码在 3 分钟内可重复申请，每个入口都需要电脑批准。关闭窗口、到时或在配对终端按 Ctrl+C 即结束；已批准的连接不受影响。</p>
</main><script src="i18n.js?v=209"></script><script src="js/approval.js?v=209"></script></body></html>
