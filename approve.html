<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; object-src 'none'"><title>Remote Agent · 入口授权</title><link rel="stylesheet" href="approval.css?v=207"></head>
<body><main><h1>核对并授权入口</h1><p>在同一设备的各个入口打开配对链接，对照各入口显示的验证码。只勾选你已核对的申请，批准后它们归入同一设备，各自独立验证。</p><p id="status" role="status">正在读取申请…</p><div id="requests"></div><label>设备名称<input id="name" maxlength="60" placeholder="例如：我的 iPhone" autocomplete="off"></label><div class="actions"><button id="approve">批准已核对的入口</button><button id="deny">拒绝所选</button><button id="refresh">刷新列表</button><button id="close">结束本次授权</button></div><p>此页面的地址仅供电脑端使用，请勿分享。结束授权后，未批准的申请失效；已批准的入口仍可正常连接。</p></main><script src="i18n.js?v=207"></script><script src="js/approval.js?v=207"></script></body></html>
