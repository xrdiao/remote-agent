plugins {
    id 'com.android.application'
}

android {
    namespace 'com.agentremote'
    compileSdk 34

    defaultConfig {
        applicationId 'uk.luojiajiang.remoteagent'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.4.0'
        // Optional: forks can bake in their own app address; otherwise the user enters it on first launch.
        resValue 'string', 'default_url', System.getenv('APP_URL') ?: ''
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.core:core:1.13.1'
}
