plugins {
    id 'com.android.application'
}

android {
    namespace 'com.agentremote'
    compileSdk 34

    defaultConfig {
        applicationId 'uk.luojiajiang.remoteagent'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.4.1'
        // Optional: forks can bake in their own app address; otherwise the user enters it on first launch.
        resValue 'string', 'default_url', System.getenv('APP_URL') ?: ''
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    applicationVariants.configureEach { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.configureEach {
                outputFileName = 'AgentRemote.apk'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
